<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quadratic Equation Roots Calculator</title>
</head>
<body>

    <h2>Quadratic Equation Roots Calculator</h2>
    <p>Esta página web encuentra las raíces de una ecuación polinómica de la siguiente forma:<br>
       <em>ax<sup>2</sup> + bx + c = 0</em></p>
    <p><em>a, b, and c must be integers between -99 and +99, and a must be non-zero.</em></p>

    <label for="valA">a:</label>
    <input type="number" id="valA" min="-99" max="99">

    <label for="valB">b:</label>
    <input type="number" id="valB" min="-99" max="99">

    <label for="valC">c:</label>
    <input type="number" id="valC" min="-99" max="99">
    <br><br>

    <button id="btnCalcular">Calculate roots</button>

    <p id="resultado"></p>

    <script src="ejercicio14.js"></script>
</body>
</html>

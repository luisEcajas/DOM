<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Compound Interest Calculator</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
            margin-top: 20px;
            font-family: Arial, sans-serif;
        }
        th {
            background-color: #1a1a4b;
            color: white;
            padding: 10px;
        }
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h2>Compound Interest Calculator</h2>

    <label for="deposito">Initial deposit:</label>
    <input type="number" id="deposito"><br><br>

    <label for="tasa">Annual interest rate:</label>
    <input type="number" id="tasa"> %<br><br>

    <label for="anios">Years to grow:</label>
    <input type="number" id="anios"><br><br>

    <button id="btnCalcular">Generate compound interest</button>

    <table>
        <thead>
            <tr>
                <th>Year</th>
                <th>Starting Value</th>
                <th>Interest Earned</th>
                <th>Ending Value</th>
            </tr>
        </thead>
        <tbody id="tablaResultados">
            </tbody>
    </table>

    <script src="ejercicio19.js"></script>
</body>
</html>

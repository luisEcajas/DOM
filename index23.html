<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego del Número Secreto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f9;
        }
        .contenedor-juego {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 320px;
        }
        input[type="number"] {
            width: 60px;
            padding: 8px;
            font-size: 16px;
            text-align: center;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
        }
        .estado-pantalla {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #fafafa;
            min-height: 40px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="contenedor-juego">
    <h3>Adivina el Número Secreto</h3>
    <p>Introduce un número entre 0 y 5. Tienes 3 intentos.</p>
    
    <input type="number" id="numUsuario" min="0" max="5">
    <button id="btnAdivinar">Probar</button>

    <div id="pantallaMensaje" class="estado-pantalla">¡Buena suerte!</div>
</div>

<script src="ejercicio23.js"></script>
</body>
</html>

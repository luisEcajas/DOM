<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Sencilla</title>
</head>
<body>

    <h2>Calculadora Básica</h2>

    <input type="number" id="numero1" placeholder="Primer número">
    
    <select id="operacion">
        <option value="suma">+</option>
        <option value="resta">-</option>
        <option value="multiplicacion">*</option>
        <option value="division">/</option>
    </select>

    <input type="number" id="numero2" placeholder="Segundo número">
    
    <button id="btnCalcular">Calcular</button>

    <h3>Resultado: <span id="resultado">0</span></h3>

    <script src="ejercicio12.js"></script>
</body>
</html>
